# 压缩赛道 np 子赛道的端到端最小示例，流水线依次完成载入、重建质量评估、导出 .ls 与指标。
# 输入为赛道仓库留存的一批小型测试数据，流水线只读取它们：原始信号 np_smoke 文件对、重建结果 np_decomp、压缩结果 np_comp。
# 重建质量算子直接比较磁盘上的原始与重建文件，指标写入 .ls 同级的评测结果文件 np_smoke.eval.json。
name: lince-e2e-eeg-compression-np-smoke
linxi_plugin:
  - linxi_linceplugin
steps:
  - stage: load
    processor_name: "LoadCompress2BciNpStream"
    params:
      input_path: "__TRACK_ROOT__/output/work/smoke/np_smoke.ap.bin"
      recording_key: "query"
  - stage: quality
    processor_name: "Compress2BciReconQuality"
    params:
      subtrack: "np"
      original_path: "__TRACK_ROOT__/output/work/smoke/np_smoke.ap.bin"
      rebuilt_path: "__TRACK_ROOT__/output/work/smoke/np_decomp/np_reconstructed.ap.bin"
      compressed_path: "__TRACK_ROOT__/output/work/smoke/np_comp"
  - stage: export
    processor_name: "WriteLinshuFile"
    params:
      output_path: "__OUTPUT_ROOT__/np_smoke.ls"
      ecephys_key: "query"
      overwrite: true
      # 原始信号约 2 GB，.ls 只导出记录元数据与处理历史
      skip_raw_signals: true
  - stage: export
    processor_name: "ExportEvalMetrics"
    params: {}
