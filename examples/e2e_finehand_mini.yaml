# 精细手部赛道的端到端最小示例，流水线依次完成载入、GRU 推理、导出 .ls，评测结果文件由推理算子写出。
# 处理的 session 为 Data_heldin/2026060501，共 14 个 trial、3460 帧。
# heldin 目录含关键点真值数据，推理算子用它计算评分。
name: lince-e2e-finehand-mini
linxi_plugin:
  - linxi_linceplugin
steps:
  - stage: load
    processor_name: "LoadLinceFineHandSession"
    params:
      session_dir: "__DATA_ROOT__/Data_heldin/2026060501"
      recording_key: "query"
  - stage: postprocess
    processor_name: "FineHandGruInfer"
    params:
      session_dir: "__DATA_ROOT__/Data_heldin/2026060501"
      model_dir: "__DATA_ROOT__/Participant_Implementation/Submission/model"
      track_root: "__TRACK_ROOT__"
      output_dir: "__OUTPUT_ROOT__"
      device: "cpu"
      num_threads: 4
  - stage: export
    processor_name: "WriteLinshuFile"
    params:
      output_path: "__OUTPUT_ROOT__/2026060501.ls"
      ecephys_key: "query"
      overwrite: true
