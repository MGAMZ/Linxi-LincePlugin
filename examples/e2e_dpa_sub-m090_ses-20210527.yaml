# 临策·记忆状态跨个体跨天解码 — DPA m090 评测 session 端到端最小链路为 双载入 → 基线推理 → LinshuFile 导出 → 评测结果文件导出。
# 本链处理的 session：challenge3 / sub-m090_ses-20210527，为评测日。
# 双输入：support = eval-2 共 288 trial 无标签，query = eval-1 共 32 trial 带标签，最后载入，context.session 为 eval-1 文件主干。
# 链上推理 method=baseline：challenge3 跨个体基线，对应方法配置 identity/pooled_cvC。
# 逐标签 golden 对照行 = output/csv/method_selection.json 选定法在 methods_results.json 的 m090 eval-1 行。
name: lince-e2e-dpa-sub-m090_ses-20210527
linxi_plugin:
  - linxi_linceplugin
steps:
  - stage: load
    processor_name: "LoadLinceDpaSession"
    params:
      input_path: "__DATA_ROOT__/challenge3/sub-m090_ses-20210527_task-DPA-eval-2.nwb"
      recording_key: "support"
  - stage: load
    processor_name: "LoadLinceDpaSession"
    params:
      input_path: "__DATA_ROOT__/challenge3/sub-m090_ses-20210527_task-DPA-eval-1.nwb"
      recording_key: "query"
  - stage: postprocess
    processor_name: "DpaBaselineInfer"
    params:
      track_root: "__TRACK_ROOT__"
      eval_path: "__DATA_ROOT__/challenge3/sub-m090_ses-20210527_task-DPA-eval-1.nwb"
      method: "baseline"
  - stage: export
    processor_name: "LinceWriteLinshuFile"
    params:
      output_path: "__OUTPUT_ROOT__/sub-m090_ses-20210527_task-DPA-eval-1.ls"
      ecephys_key: "query"
      # eval-1 逐 trial 预测两列写入顶层 trials 表随导出写出
      session_scalar_cols: []
      require_eval_cols: true
      on_lossy: "warn"
      overwrite: true
  - stage: export
    processor_name: "ExportEvalMetrics"
    params: {}
