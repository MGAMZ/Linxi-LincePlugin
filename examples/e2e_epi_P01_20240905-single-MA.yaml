# 硬膜外赛道单动作 session 的端到端最小示例，流水线依次完成载入、截取评测窗口、基线推理、导出 .ls 与评测结果文件。
# 处理的 session 为 P01_20240905-single-MA，评测日 2024-09-05。
# 训练集为 train_root 指向目录下全部 heldin session，解码对评测窗口输出 0–7 共 8 类预测。
name: lince-e2e-epi-P01_20240905-single-MA
linxi_plugin:
  - linxi_linceplugin
steps:
  - stage: load
    processor_name: "LoadLinceEpiSession"
    params:
      input_path: "__DATA_ROOT__/P01_20240905-single-MA"
      recording_key: "query"
  - stage: preprocess
    processor_name: "EpiExtractActionWindows"
    params:
      recording_key: "query"
      window_start: 0.2
      window_duration: 2.0
  - stage: postprocess
    processor_name: "EpiBaselineInfer"
    params:
      train_root: "__DATA_ROOT__"
      recording_key: "query"
  - stage: export
    processor_name: "LinceWriteIeegLinshuFile"
    params:
      output_path: "__OUTPUT_ROOT__/P01_20240905-single-MA.ls"
      recording_key: "query"
      require_eval_cols: true
      on_lossy: "warn"
      overwrite: true
  - stage: export
    processor_name: "ExportEvalMetrics"
    params: {}
