# 临策·基于人类硬膜外脑电的运动解码 — NEO heldin 单动作 session 端到端最小链路为 载入 → 评测窗口 → baseline 推理 → LinshuFile 导出 → 评测结果文件导出。
# 固定测试 session：P01_20240905-single-MA，评测日 2024-09-05。
# 训练集 = train_root 下全部 heldin session，对 query 窗口输出 0–7 预测列。
# 逐样本比较的参考基准 = 赛道仓库 output/csv/heldin_predictions.csv，即官方 model.pkl 逐窗口推理标签。
name: lince-e2e-epi-P01_20240905-single-MA
linxi_plugin:
  - linxi_linceplugin.epidural_motion_decode.load_session
  - linxi_linceplugin.epidural_motion_decode.action_windows
  - linxi_linceplugin.epidural_motion_decode.decode_baseline
  - linxi_linceplugin.export.ieeg_linshufile
  - linxi_linceplugin.export.eval_metrics
steps:
  - stage: load
    processor_name: "LoadLinceEpiSession"
    params:
      input_path: "__DATA_ROOT__/P01_20240905-single-MA"
      recording_key: "query"
  - stage: preprocess
    processor_name: "EpiExtractActionWindows"
    params:
      recording_key: "query"
      window_start: 0.2
      window_duration: 2.0
  - stage: postprocess
    processor_name: "EpiBaselineInfer"
    params:
      train_root: "__DATA_ROOT__"
      recording_key: "query"
  - stage: export
    processor_name: "LinceWriteIeegLinshuFile"
    params:
      output_path: "__OUTPUT_ROOT__/P01_20240905-single-MA.ls"
      recording_key: "query"
      require_eval_cols: true
      on_lossy: "warn"
      overwrite: true
  - stage: export
    processor_name: "ExportEvalMetrics"
    params: {}
