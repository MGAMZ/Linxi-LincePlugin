# 临策·运动跨天解码 — WF baseline 端到端最小链路（载入 → 解码推理 → 漂移分析 → LinshuFile 导出）。
# 钉死 session：MA_CO / easy / MA-CO-20231227-01。
# query = private/MA_CO/easy/heldout（25 trials，评测侧）；support = 同日 public/MA_CO/easy/heldin（100 trials，校准侧）。
# 两个 load 步骤各自显式传 input_path，互不污染；query 侧最后载入，context.session 落评测侧目录标签。
# WF bundle 自带 z-score 统计，链路不加外部标准化步骤。
name: lince-e2e-wf-MA-CO-20231227-01
linxi_plugin:
  - linxi_linceplugin.load_lince_session
  - linxi_linceplugin.decode_baseline
  - linxi_linceplugin.drift_analysis
  - linxi_linceplugin.export_wiring
steps:
  - stage: load
    processor_name: "LoadLinceSession"
    params:
      input_path: "__DATA_ROOT__/public/MA_CO/easy/heldin/MA-CO-20231227-01/MA-CO-20231227-01.nwb"
      recording_key: "support"
      data_root: "__DATA_ROOT__"
  - stage: load
    processor_name: "LoadLinceSession"
    params:
      input_path: "__DATA_ROOT__/private/MA_CO/easy/heldout/MA-CO-20231227-01/MA-CO-20231227-01.nwb"
      recording_key: "query"
      data_root: "__DATA_ROOT__"
  - stage: postprocess
    processor_name: "BaselineDecodeInfer"
    params:
      model: "wf"
      source: "context"
      baseline_code_path: "__CODE_ROOT__"
      data_root: "__DATA_ROOT__"
      task: "MA_CO"
      level: "easy"
      session_key: "MA-CO-20231227-01"
  - stage: analyze
    processor_name: "LinceDriftAnalysis"
    params:
      source: "context"
      target_keys: ["query"]
      centroid_key: "support"
      session_key: "MA-CO-20231227-01"
      train_session_keys: ["MA-CO-20231227-01"]
  - stage: export
    processor_name: "LinceWriteLinshuFile"
    params:
      output_path: "__OUTPUT_ROOT__/MA-CO-20231227-01.ls"
      ecephys_key: "query"
      # 解码评测落位在 auxiliary_channels / notes / channel_summary（task-2 映射 #3 路线②），trials 表为结构性列
      session_scalar_cols: []
      require_eval_cols: false
      on_lossy: "warn"
      overwrite: true
