# 运动赛道 WF 基线的端到端最小示例，流水线依次完成载入、解码推理、漂移分析、导出 .ls。
# 处理的 session 为 MA-CO-20231227-01，任务 MA_CO，难度 easy。
# 校准数据 support 取自 public/MA_CO/easy/heldin，共 100 个 trial。评测数据 query 取自 private/MA_CO/easy/heldout，共 25 个 trial，放在最后载入。
name: lince-e2e-wf-MA-CO-20231227-01
linxi_plugin:
  - linxi_linceplugin
steps:
  - stage: load
    processor_name: "LoadLinceSession"
    params:
      input_path: "__DATA_ROOT__/public/MA_CO/easy/heldin/MA-CO-20231227-01/MA-CO-20231227-01.nwb"
      recording_key: "support"
      data_root: "__DATA_ROOT__"
  - stage: load
    processor_name: "LoadLinceSession"
    params:
      input_path: "__DATA_ROOT__/private/MA_CO/easy/heldout/MA-CO-20231227-01/MA-CO-20231227-01.nwb"
      recording_key: "query"
      data_root: "__DATA_ROOT__"
  - stage: postprocess
    processor_name: "BaselineDecodeInfer"
    params:
      model: "wf"
      source: "context"
      baseline_code_path: "__CODE_ROOT__"
      data_root: "__DATA_ROOT__"
      task: "MA_CO"
      level: "easy"
      session_key: "MA-CO-20231227-01"
  - stage: analyze
    processor_name: "LinceDriftAnalysis"
    params:
      source: "context"
      target_keys: ["query"]
      centroid_key: "support"
      session_key: "MA-CO-20231227-01"
      train_session_keys: ["MA-CO-20231227-01"]
  - stage: export
    processor_name: "LinceWriteLinshuFile"
    params:
      output_path: "__OUTPUT_ROOT__/MA-CO-20231227-01.ls"
      ecephys_key: "query"
      # trials 表只含结构列，解码预测位于 query 记录的 auxiliary_channels，评分位于评测结果文件
      session_scalar_cols: []
      require_eval_cols: false
      on_lossy: "warn"
      overwrite: true
  - stage: export
    processor_name: "ExportEvalMetrics"
    params: {}
