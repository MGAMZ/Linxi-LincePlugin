# 临策·基于人类硬膜外脑电的运动解码 — NEO heldin 组合动作 session 端到端最小链路（载入 → 评测窗口 → baseline 推理 → LinshuFile 导出 → 评测侧车导出）。
# 固定测试 session：P01_20241112-dual-MA（训练集中唯一的 dual 日）。
# dual trigger 编码与 single 同码不同义，范式判定与标签映射在载入层按目录名完成，下游只消费 label 列。
name: lince-e2e-epi-P01_20241112-dual-MA
linxi_plugin:
  - linxi_linceplugin.epidural_motion_decode.load_session
  - linxi_linceplugin.epidural_motion_decode.action_windows
  - linxi_linceplugin.epidural_motion_decode.decode_baseline
  - linxi_linceplugin.export.eeg_linshufile
  - linxi_linceplugin.export.eval_metrics
steps:
  - stage: load
    processor_name: "LoadLinceEpiSession"
    params:
      input_path: "__DATA_ROOT__/P01_20241112-dual-MA"
      recording_key: "query"
  - stage: preprocess
    processor_name: "EpiExtractActionWindows"
    params:
      recording_key: "query"
      window_start: 0.2
      window_duration: 2.0
  - stage: postprocess
    processor_name: "EpiBaselineInfer"
    params:
      train_root: "__DATA_ROOT__"
      recording_key: "query"
  - stage: export
    processor_name: "LinceWriteEegLinshuFile"
    params:
      output_path: "__OUTPUT_ROOT__/P01_20241112-dual-MA.ls"
      recording_key: "query"
      require_eval_cols: true
      on_lossy: "warn"
      overwrite: true
  - stage: export
    processor_name: "ExportEvalMetrics"
    params: {}
