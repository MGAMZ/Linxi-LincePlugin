# 硬膜外赛道组合动作 session 的端到端最小示例，流水线依次完成载入、截取评测窗口、基线推理、导出 .ls 与评测结果文件。
# 处理的 session 为 P01_20241112-dual-MA，训练集中唯一的 dual 日。
# 载入算子根据目录名中的 single 或 dual 判定并填写动作标签，后续步骤使用 label 列。
name: lince-e2e-epi-P01_20241112-dual-MA
linxi_plugin:
  - linxi_linceplugin
steps:
  - stage: load
    processor_name: "LoadLinceEpiSession"
    params:
      input_path: "__DATA_ROOT__/P01_20241112-dual-MA"
      recording_key: "query"
  - stage: preprocess
    processor_name: "EpiExtractActionWindows"
    params:
      recording_key: "query"
      window_start: 0.2
      window_duration: 2.0
  - stage: postprocess
    processor_name: "EpiBaselineInfer"
    params:
      train_root: "__DATA_ROOT__"
      recording_key: "query"
  - stage: export
    processor_name: "LinceWriteIeegLinshuFile"
    params:
      output_path: "__OUTPUT_ROOT__/P01_20241112-dual-MA.ls"
      recording_key: "query"
      require_eval_cols: true
      on_lossy: "warn"
      overwrite: true
  - stage: export
    processor_name: "ExportEvalMetrics"
    params: {}
