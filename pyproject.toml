[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linxi-plugin-lince"
version = "0.1.0"
description = "临策算法竞赛通用算子插件仓库"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "mgam", email = "312065559@qq.com" }
]
dependencies = [
    # WF baseline decoder (decode_baseline) and NEO baseline (EpiBaselineInfer)
    "scikit-learn",
    # NEO 赛道 BDF 读取 (epidural_motion_decode._bdf)
    "pyedflib",
]

[project.optional-dependencies]
gru = [
    # GRU baseline decoder; plain "torch" = device-neutral wheel choice, no CUDA flavor pin
    "torch",
]

[tool.hatch.build.targets.wheel]
packages = ["linxi_linceplugin"]

[tool.hatch.build]
include = [
    "linxi_linceplugin/**/*.py",
    "README.md",
    "NEXTSTEPS.md",
]
